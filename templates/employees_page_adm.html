{% extends "admin_home.html" %}

{% block main %}
<h1 id="emp_head"> People </h1>

<div class="table-wrapper">
    <table class="table table-bordered center-tag" id="emp-table">
        <tr class="table-primary">
            <td> Employee ID </td>
            <td> Name </td>
            <td> Designation </td>
            <td> Joining Date</td>
            <td> Actions </td>
        </tr>
        {% for employee in employees_data %}
        <tr>
            <td> {{ employee['emp_id'] }}</td>
            <td> {{ employee['emp_name'] }}</td>
            <td> {{ employee['designation'] }} </td>
            <td> {{ employee['joining_date'] }} </td>
            <td>
                <button class="btn btn-primary btn-lg">
                    <a class="link" id="view-emp-btn" href="/admin/view_employee/{{ employee['emp_id'] }}"> <i class="fa-solid fa-circle-info"></i> Details </a>
                </button>
                <button class="btn btn-primary btn-lg">
                    <a class="link" id="edit-emp-btn" href="/admin/edit_employee/{{employee['emp_id']}}"> <i class="fa-solid fa-pen-to-square"></i> Edit </a>
                </button>
                <button class="btn btn-danger btn-lg">
                    <a class="link" id="dereg-emp-btn" href="/admin/dereg_employee/{{employee['emp_id']}}"> - Deregister </a>
                </button>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

<div class="reg-btn-wrapper">
    <button class="btn btn-primary btn-lg"> <a class="link" id="reg-btn" href="/admin/register_employee"> + Register an employee </a></button>
</div>

{% endblock %}
